<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perde — Birlikte İzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="marquee">
    <span class="wordmark">Perde</span>
    <div class="marquee-meta">
      <span class="room-pill" id="room-pill" hidden>Oda <strong id="room-pill-code">—</strong></span>

      <div class="voice-controls" id="voice-controls">
        <button class="mic-btn" id="mic-btn" data-state="off" title="Sesli sohbete katıl" aria-label="Sesli sohbete katıl">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <span class="mic-label">Mikrofon</span>
        </button>

        <button class="ptt-btn" id="ptt-btn" type="button" hidden title="Basılı tutup konuş">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          </svg>
          <span class="ptt-key-label" id="ptt-key-label">Space</span>
        </button>

        <button class="ptt-rebind-btn" id="ptt-rebind-btn" type="button" hidden title="Bas-konuş tuşunu değiştir" aria-label="Bas-konuş tuşunu değiştir">⌨</button>
      </div>

      <span class="conn" id="conn-indicator" data-state="connecting">
        <span class="conn-dot"></span>
        <span class="conn-label">Bağlanıyor…</span>
      </span>

      <button class="leave-room-btn" id="leave-room-btn" type="button" hidden title="Odadan çık" aria-label="Odadan çık">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Odadan çık</span>
      </button>
    </div>
  </header>

  <main class="stage-area">
    <div class="video-column">
      <div class="url-bar">
        <input type="text" id="video-url" placeholder="kuduruk behiye simulator (.mp4, .webm)">
        <button id="load-video">Yükle</button>
      </div>

      <div class="theatre" id="theatre">
        <div class="video-wrap" id="video-wrap">
          <video id="video-player" controls controlsList="nofullscreen noremoteplayback nopictureinpicture" disablePictureInPicture playsinline></video>

          <div class="player-controls-top">
            <button class="seek-btn" id="seek-back-btn" title="5 saniye geri" aria-label="5 saniye geri">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
              <span>5</span>
            </button>
            <button class="seek-btn" id="seek-fwd-btn" title="5 saniye ileri" aria-label="5 saniye ileri">
              <span>5</span>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
            </button>
            <button class="seek-btn fs-btn" id="fullscreen-btn" title="Tam ekran / çık" aria-label="Tam ekran">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>
              </svg>
            </button>
          </div>

          <div class="empty-screen" id="empty-screen">
            <p>Henüz bir video yüklenmedi.</p>
            <p class="empty-screen-sub">Üstteki kutuya bir video linki yapıştırıp <strong>Yükle</strong>'ye bas — herkesin ekranında birlikte açılsın.</p>
          </div>

          <div class="emote-fly-layer" id="emote-fly-layer" aria-hidden="true"></div>
        </div>

        <aside class="chat-panel" id="chat-panel">
          <div class="chat-resize-handle" id="chat-resize-handle"></div>

          <div class="chat-header">
            <span>Sohbet</span>
            <button class="chat-toggle" id="chat-toggle" title="Sohbeti küçült" aria-label="Sohbeti küçült">–</button>
          </div>

          <div class="voice-roster" id="voice-roster" hidden></div>

          <div class="chat-box" id="chat-box"></div>

          <div class="emote-bar" id="emote-bar">
            <button type="button" data-emoji="😂" title="😂">😂</button>
            <button type="button" data-emoji="🤣" title="🤣">🤣</button>
            <button type="button" data-emoji="❤️" title="❤️">❤️</button>
            <button type="button" data-emoji="😮" title="😮">😮</button>
            <button type="button" data-emoji="😢" title="😢">😢</button>
            <button type="button" data-emoji="😭" title="😭">😭</button>
            <button type="button" data-emoji="😡" title="😡">😡</button>
            <button type="button" data-emoji="👍" title="👍">👍</button>
            <button type="button" data-emoji="👏" title="👏">👏</button>
            <button type="button" data-emoji="🔥" title="🔥">🔥</button>
            <button type="button" data-emoji="🎉" title="🎉">🎉</button>
            <button type="button" data-emoji="🍿" title="🍿">🍿</button>
            <button type="button" data-emoji="😱" title="😱">😱</button>
            <button type="button" data-emoji="💀" title="💀">💀</button>
            <button type="button" data-emoji="😍" title="😍">😍</button>
            <button type="button" data-emoji="😴" title="😴">😴</button>
            <button type="button" data-emoji="🤔" title="🤔">🤔</button>
            <button type="button" data-emoji="😎" title="😎">😎</button>
            <button type="button" data-emoji="🙄" title="🙄">🙄</button>
            <button type="button" data-emoji="🥳" title="🥳">🥳</button>
            <button type="button" data-emoji="👀" title="👀">👀</button>
            <button type="button" data-emoji="💯" title="💯">💯</button>
            <button type="button" data-emoji="🙌" title="🙌">🙌</button>
            <button type="button" data-emoji="🤯" title="🤯">🤯</button>
          </div>

          <div class="chat-input-row">
            <button type="button" class="emote-toggle-btn" id="emote-toggle-btn" title="Emojileri göster/gizle" aria-label="Emojileri göster/gizle">😊</button>
            <input type="text" id="chat-input" placeholder="Mesaj yaz..." maxlength="300">
            <button id="send-chat">Gönder</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div class="voice-audio-layer" id="voice-audio-layer" aria-hidden="true" hidden></div>

  <!-- Odaya giriş formu: native prompt() yerine temaya uygun modal -->
  <div class="join-overlay" id="join-overlay">
    <form class="join-card" id="join-form">
      <span class="join-wordmark">Perde</span>
      <p class="join-sub">Birlikte izlemeye başlamak için bir oda seç.</p>
      <label class="join-field">
        <span>İsmin</span>
        <input type="text" id="join-name" maxlength="20" placeholder="Misafir" autocomplete="off" required>
      </label>
      <label class="join-field">
        <span>Oda kodu</span>
        <input type="text" id="join-room" maxlength="30" placeholder="ör. SINEMA1" autocomplete="off" required>
      </label>
      <p class="join-hint">Aynı kodu giren herkes aynı odada buluşur.</p>
      <button type="submit">Odaya gir</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
